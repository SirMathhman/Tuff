# ~/.pi/agent/hook/hooks.yaml  (or <project>/.pi/hook/hooks.yaml)
hooks:
  - id: test-and-format-on-idle
    event: session.idle
    scope: all
    actions:
      - bash:
          command: "bun run test"
          timeout: 60000
      - bash:
          command: "bun run format:prettier"
          timeout: 60000